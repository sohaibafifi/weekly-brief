timezone: Europe/Paris
output_dir: ~/Documents/WeeklyBrief
locale: fr

work_hours:
  monday:    [["08:00", "19:00"]]
  tuesday:   [["08:00", "19:00"]]
  wednesday: [["08:00", "19:00"]]
  thursday:  [["08:00", "19:00"]]
  friday:    [["08:00", "19:00"]]

imap:
  host: imap.example.com
  port: 993
  user: me@example.com
  password_env: IMAP_PWD
  inbox: INBOX
  sent: "Sent"

smtp:
  host: smtp.example.com
  port: 465
  user: me@example.com
  password_env: SMTP_PWD
  to: me@example.com

calendars:
  # Single URL (compact form):
  - name: Personal
    category: personal
    url: https://example.com/personal.ics

  # Several URLs grouped under one category — each feed appears as
  # "<name> #1", "<name> #2", … in source_name (used for the meeting-prep block).
  - name: Work
    category: work
    urls:
      - https://example.com/work-main.ics
      - https://example.com/work-team.ics
      - https://example.com/work-shared.ics

  # Multiple separate entries with the same `category` also work — useful when
  # each feed has its own meaningful name.
  - name: Family
    category: family
    url: https://example.com/family.ics
  - name: Kids school
    category: family
    url: https://example.com/school.ics

vips:
  - boss@example.org
  - "@important-client.com"

mail_rules:
  flagged: true
  vip: true
  awaiting_reply: true
  awaiting_reply_lookback_days: 14
  vip_lookback_days: 14
  flagged_lookback_days: 30

llm:
  provider: mistral
  model: mistral-large-latest
  api_key_env: MISTRAL_API_KEY
  features:
    week_narrative: true
    per_meeting_prep: true
  max_tokens_total: 4000
  base_url: https://api.mistral.ai/v1

# Optional: publish each weekly brief as a row in a Notion database.
# Steps:
#   1. https://www.notion.so/profile/integrations → New internal integration → copy token into NOTION_API_KEY env.
#   2. Create a database with a Title property and a Date property.
#   3. Click "..." on database → "Connections" → add your integration.
#   4. Copy the database ID from its URL (32-char hex, no dashes).
notion:
  enabled: false
  api_key_env: NOTION_API_KEY
  database_id: ""
  title_prop: Name      # exact label of the title column
  week_prop: Week       # exact label of the date column (set to "" to disable)
  summary_prop: Summary # rich_text column for narrative (set to "" to disable)
  url_prop: ""          # optional URL property; leave "" to disable
